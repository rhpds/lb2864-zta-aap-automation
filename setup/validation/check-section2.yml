---
# Section 2 Validation: Deploy Application with Short-Lived Credentials
#
# RUNTIME-AUTOMATION CONTEXT:
#   module-02/setup-central.sh fires when student advances to Section 2.
#   It removes Section 1 templates (remove_section=1) and creates Section 2
#   templates (section2,rbac). Run this check DURING Section 2.
#
#   After advancing to Section 3, module-03 mutates IdM groups:
#   neteng moves from team-infrastructure → team-readonly.
#   The "neteng in team-infrastructure" check below is only valid in Section 2.
#
# Checks:
#   - 5 pipeline job templates exist in AAP
#   - Workflow template "Deploy Application Pipeline" exists
#   - OPA db_access policy: appdev allowed, neteng denied
#   - Application healthy at http://app.zta.lab:8081
#   - Arista ACL on ceos2 is correctly scoped (not overly permissive)
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini setup/validation/check-section2.yml

- name: "Section 2 Check | AAP Templates & Workflow"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [section2, aap]

  vars_files:
    - validation_vars.yml

  tasks:
    - name: Check Section 2 job templates
      uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/?name={{ item | urlencode }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s2_template_checks
      loop: "{{ expected_section2_templates }}"
      loop_control:
        label: "{{ item }}"
      failed_when: false

    - name: Check workflow template
      uri:
        url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/?name={{ expected_section2_workflow | urlencode }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s2_workflow_check
      failed_when: false

    - name: Parse template results
      set_fact:
        s2_template_results: >-
          {{ s2_template_results | default({}) | combine({
            item.item: ((item.json.count | default(0)) > 0)
          }) }}
      loop: "{{ s2_template_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Store workflow check
      set_fact:
        s2_workflow_ok: "{{ (s2_workflow_check.json.count | default(0)) > 0 }}"
        s2_workflow_id: "{{ (s2_workflow_check.json.results | default([]) | first | default({})).id | default('') }}"

    - name: Check workflow node topology
      uri:
        url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/{{ s2_workflow_id }}/workflow_nodes/?page_size=20"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s2_workflow_nodes
      failed_when: false
      when: s2_workflow_id | length > 0

    - name: Parse workflow node names
      set_fact:
        s2_node_names: >-
          {{ s2_workflow_nodes.json.results | default([])
             | map(attribute='summary_fields')
             | map(attribute='unified_job_template')
             | map(attribute='name', default='')
             | list }}
        s2_node_count: "{{ s2_workflow_nodes.json.count | default(0) }}"
      when: s2_workflow_nodes is not skipped and s2_workflow_nodes.status == 200

    - name: Check workflow team assignments (role_team_assignments)
      uri:
        url: "{{ aap_host }}/api/controller/v2/role_team_assignments/?content_type__model=workflowjobtemplate&object_id={{ s2_workflow_id }}&page_size=50"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s2_workflow_teams
      failed_when: false
      when: s2_workflow_id | length > 0

    - name: Check 'Check DB Policy' student template exists
      uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Check+DB+Policy"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s2_student_template_check
      failed_when: false

    - name: Initialise workflow node defaults (safe before conditional parse)
      set_fact:
        s2_node_count: "{{ s2_node_count | default(0) }}"
        s2_node_names: "{{ s2_node_names | default([]) }}"

    - name: Store extended workflow checks
      set_fact:
        s2_workflow_teams_ok: >-
          {{ (s2_workflow_teams.json.count | default(0)) >= 4 }}
        s2_student_template_ok: "{{ (s2_student_template_check.json.count | default(0)) > 0 }}"
        s2_workflow_nodes_ok: >-
          {{
            (s2_node_count | int) == 4 and
            'Check DB Access Policy' in s2_node_names and
            'Create DB Credential' in s2_node_names and
            'Configure DB Access List' in s2_node_names and
            'Deploy Application' in s2_node_names
          }}

- name: "Section 2 Check | OPA DB Access Policy"
  hosts: zta_services
  become: false
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  tags: [section2, opa]

  tasks:
    - name: Test OPA db_access allow (appdev)
      uri:
        url: "{{ opa_url }}/v1/data/zta/db_access/decision"
        method: POST
        body_format: json
        body:
          input:
            user: appdev
            user_groups: [app-deployers]
            target_database: "{{ db_name }}"
            requested_permissions: [SELECT, INSERT, UPDATE]
      register: s2_opa_db_allow
      failed_when: false

    - name: Test OPA db_access deny (neteng)
      uri:
        url: "{{ opa_url }}/v1/data/zta/db_access/decision"
        method: POST
        body_format: json
        body:
          input:
            user: neteng
            user_groups: []
            target_database: "{{ db_name }}"
            requested_permissions: [SELECT, INSERT, UPDATE]
      register: s2_opa_db_deny
      failed_when: false

    - name: Authenticate to Vault for lease check
      uri:
        url: "{{ vault_addr }}/v1/auth/userpass/login/admin"
        method: POST
        body_format: json
        body:
          password: "{{ idm_admin_password }}"
        validate_certs: false
        status_code: [200]
      register: s2_vault_login
      failed_when: false
      delegate_to: localhost

    - name: Check active Vault DB leases (dynamic users exist)
      shell: >
        curl -sk -X LIST
        -H "X-Vault-Token: {{ s2_vault_login.json.auth.client_token | default('') }}"
        {{ vault_addr }}/v1/sys/leases/lookup/database/creds/ztaapp-short-lived/
      register: s2_vault_lease_check
      changed_when: false
      failed_when: false
      delegate_to: localhost
      when: s2_vault_login.status | default(0) == 200

    - name: Parse Vault lease check result
      set_fact:
        s2_vault_leases_ok: >-
          {{ ((s2_vault_lease_check.stdout | default('{}') | from_json).get('data', {}) | default({})).get('keys', []) | length > 0 }}
      failed_when: false
      when: s2_vault_lease_check is not skipped

    - name: Check neteng is in team-infrastructure group in IdM
      # Valid during Section 2 only. module-03 runtime-automation moves neteng
      # from team-infrastructure → team-readonly as part of Section 3 setup.
      command: ipa user-show neteng --all
      register: s2_neteng_groups
      changed_when: false
      failed_when: false
      become: true

- name: "Section 2 Check | Application Health"
  hosts: zta_services
  become: false
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  tags: [section2, app]

  tasks:
    - name: Check application health
      uri:
        url: "http://{{ app_host }}:{{ app_port }}/health"
        method: GET
        status_code: [200]
      register: s2_app_health
      failed_when: false

    - name: Check application dashboard
      uri:
        url: "http://{{ app_host }}:{{ app_port }}/"
        method: GET
        status_code: [200, 302]
      register: s2_app_dashboard
      failed_when: false

- name: "Section 2 Check | Arista ACL"
  hosts: ceos2
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  tags: [section2, network]

  tasks:
    - name: Check ACL on ceos2
      arista.eos.eos_command:
        commands:
          - show ip access-lists ZTA-APP-TO-DB
      register: s2_acl_check
      failed_when: false

- name: "Section 2 Check | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [section2, summary]

  vars:
    c: "{{ hostvars['central'] | default({}) }}"
    checks:
      - name: "Template: Check DB Access Policy"
        ok: "{{ (s2_template_results | default({}))['Check DB Access Policy'] | default(false) }}"
      - name: "Template: Create DB Credential"
        ok: "{{ (s2_template_results | default({}))['Create DB Credential'] | default(false) }}"
      - name: "Template: Configure DB Access List"
        ok: "{{ (s2_template_results | default({}))['Configure DB Access List'] | default(false) }}"
      - name: "Template: Deploy Application"
        ok: "{{ (s2_template_results | default({}))['Deploy Application'] | default(false) }}"
      - name: "Template: Rotate DB Credentials"
        ok: "{{ (s2_template_results | default({}))['Rotate DB Credentials'] | default(false) }}"
      - name: "Workflow: Deploy Application Pipeline"
        ok: "{{ s2_workflow_ok | default(false) }}"
      - name: OPA db_access allows appdev
        ok: "{{ (c.s2_opa_db_allow.json.result.allow | default(false)) == true }}"
      - name: OPA db_access denies neteng
        ok: "{{ (c.s2_opa_db_deny.json.result.allow | default(false)) == false }}"
      - name: Application healthy
        ok: "{{ (c.s2_app_health.status | default(0)) == 200 }}"
      - name: Application dashboard loads
        ok: "{{ (c.s2_app_dashboard.status | default(0)) in [200, 302] }}"
      - name: "Arista ACL correctly scoped (not 'any')"
        ok: >-
          {{
            (hostvars['ceos2']['s2_acl_check']['stdout'] | default(['']) | first) is search('host 10.20.0.10')
            and not ((hostvars['ceos2']['s2_acl_check']['stdout'] | default(['']) | first) is search('permit ip any'))
          }}
      - name: Workflow has 4 nodes (correct topology)
        ok: "{{ s2_workflow_nodes_ok | default(false) }}"
      - name: Workflow team access assigned (4+ teams)
        ok: "{{ s2_workflow_teams_ok | default(false) }}"
      - name: neteng in team-infrastructure (IdM)
        ok: "{{ 'team-infrastructure' in (c.s2_neteng_groups.stdout | default('')) }}"
      - name: Vault DB leases active (dynamic users present)
        ok: "{{ c.s2_vault_leases_ok | default(false) }}"
      - name: "Student template: Check DB Policy exists"
        ok: "{{ s2_student_template_ok | default(false) }}"

  tasks:
    - name: Build results
      set_fact:
        passed: "{{ checks | selectattr('ok') | list }}"
        failed_checks: "{{ checks | rejectattr('ok') | list }}"

    - name: Display Section 2 verification report
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║  Section 2 — Deploy Application with Short-Lived Credentials   ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║                                                                ║
          ║  PASSED: {{ passed | length }} / {{ checks | length }}
          ║                                                                ║
          {% for item in checks %}
          ║  {{ '✓' if item.ok else '✗' }}  {{ item.name }}
          {% endfor %}
          ║                                                                ║
          {% if failed_checks | length > 0 %}
          ║  ── INCOMPLETE ──                                              ║
          {% for item in failed_checks %}
          ║    - {{ item.name }}
          {% endfor %}
          {% else %}
          ║  Section 2 complete — all exercises verified.                  ║
          {% endif %}
          ║                                                                ║
          ╚══════════════════════════════════════════════════════════════════╝
