---
# Section 5 Validation: Automated Incident Response (Splunk → EDA → Vault)
#
# RUNTIME-AUTOMATION CONTEXT:
#   module-05/setup-central.sh fires when student advances to Section 5.
#   It removes Section 4 templates (remove_section=4) and creates Section 5
#   templates (section5,rbac). Splunk was deployed by module-01 and should be
#   fully running by this point. Run this check DURING Section 5.
#
# Checks:
#   - 3 job templates exist (Revoke, Simulate, Restore)
#   - EDA webhook endpoint responding on control:5000
#   - Application is healthy (pre-attack baseline)
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini setup/validation/check-section5.yml

- name: "Section 5 Check | AAP Templates"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [section5, aap]

  vars_files:
    - validation_vars.yml

  tasks:
    - name: Check Section 5 job templates
      uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/?name={{ item | urlencode }}"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s5_template_checks
      loop: "{{ expected_section5_templates }}"
      loop_control:
        label: "{{ item }}"
      failed_when: false

    - name: Parse template results
      set_fact:
        s5_template_results: >-
          {{ s5_template_results | default({}) | combine({
            item.item: ((item.json.count | default(0)) > 0)
          }) }}
      loop: "{{ s5_template_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: "Section 5 Check | EDA Activation"
  hosts: localhost
  connection: local
  gather_facts: false
  ignore_errors: true
  tags: [section5, eda]

  vars_files:
    - validation_vars.yml

  tasks:
    - name: Check EDA activation 'Splunk Events' is running
      uri:
        url: "{{ aap_host }}/api/eda/v1/activations/?name=Splunk+Events"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s5_eda_activation
      failed_when: false

    - name: Store EDA activation result
      set_fact:
        s5_eda_running: >-
          {{ (s5_eda_activation.json.results | default([])
              | selectattr('status', 'equalto', 'running') | list | length) > 0 }}

    - name: Check EDA event stream 'Splunk EDA' exists
      uri:
        url: "{{ aap_host }}/api/eda/v1/event_streams/?name=Splunk+EDA"
        method: GET
        user: "{{ aap_user }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ aap_verify_ssl }}"
        force_basic_auth: true
        status_code: [200]
      register: s5_eda_event_stream
      failed_when: false

    - name: Store EDA event stream result
      set_fact:
        s5_eda_event_stream_ok: "{{ (s5_eda_event_stream.json.count | default(0)) > 0 }}"

- name: "Section 5 Check | Splunk Integration"
  hosts: zta_services
  become: false
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  tags: [section5, splunk]

  vars_files:
    - validation_vars.yml

  tasks:
    - name: Check Splunk saved search 'ZTA: SSH Brute Force Detected'
      uri:
        url: "{{ splunk_mgmt_url }}/services/saved/searches/ZTA%3A+SSH+Brute+Force+Detected?output_mode=json"
        method: GET
        user: "{{ splunk_mgmt_user }}"
        password: "{{ splunk_mgmt_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: s5_splunk_saved_search
      failed_when: false

    - name: Check Splunk EDA addon webhook configured (ZTA stanza present)
      uri:
        url: "{{ splunk_mgmt_url }}/services/configs/conf-ansible_addon_for_splunk_environment?output_mode=json"
        method: GET
        user: "{{ splunk_mgmt_user }}"
        password: "{{ splunk_mgmt_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: s5_splunk_addon_config
      failed_when: false

    - name: Parse Splunk addon webhook URL configured
      set_fact:
        s5_splunk_addon_ok: >-
          {{
            (s5_splunk_addon_config.json.entry | default([])
            | selectattr('name', 'equalto', 'ZTA') | list | length) > 0 and
            (s5_splunk_addon_config.json.entry | default([])
            | selectattr('name', 'equalto', 'ZTA') | list
            | first | default({}) ).get('content', {}).get('webhook_url', '') | length > 0
          }}
      when: s5_splunk_addon_config.status | default(0) == 200

- name: "Section 5 Check | Application Health"
  hosts: zta_services
  become: false
  gather_facts: false
  ignore_errors: true
  ignore_unreachable: true
  tags: [section5, app]

  tasks:
    - name: Check application health
      uri:
        url: "http://{{ app_host }}:{{ app_port }}/health"
        method: GET
        status_code: [200]
      register: s5_app_health
      failed_when: false

- name: "Section 5 Check | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [section5, summary]

  vars:
    c: "{{ hostvars['central'] | default({}) }}"
    ctrl: "{{ hostvars['control'] | default({}) }}"
    checks:
      - name: "Template: Emergency: Revoke App Credentials"
        ok: "{{ (s5_template_results | default({}))['Emergency: Revoke App Credentials'] | default(false) }}"
      - name: "Template: Simulate Brute Force"
        ok: "{{ (s5_template_results | default({}))['Simulate Brute Force'] | default(false) }}"
      - name: "Template: Restore App Credentials"
        ok: "{{ (s5_template_results | default({}))['Restore App Credentials'] | default(false) }}"
      - name: EDA event stream 'Splunk EDA' created (Ex 5.1)
        ok: "{{ s5_eda_event_stream_ok | default(false) }}"
      - name: EDA activation 'Splunk Events' running (Ex 5.3)
        ok: "{{ s5_eda_running | default(false) }}"
      - name: Splunk saved search 'ZTA: SSH Brute Force Detected' exists
        ok: "{{ (c.s5_splunk_saved_search.status | default(0)) == 200 }}"
      - name: Splunk EDA addon webhook configured (ZTA stanza with URL)
        ok: "{{ c.s5_splunk_addon_ok | default(false) }}"
      - name: Application healthy (pre-attack)
        ok: "{{ (c.s5_app_health.status | default(0)) == 200 }}"

  tasks:
    - name: Build results
      set_fact:
        passed: "{{ checks | selectattr('ok') | list }}"
        failed_checks: "{{ checks | rejectattr('ok') | list }}"

    - name: Display Section 5 verification report
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════╗
          ║   Section 5 — Automated Incident Response (Splunk → EDA)       ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║                                                                ║
          ║  PASSED: {{ passed | length }} / {{ checks | length }}
          ║                                                                ║
          {% for item in checks %}
          ║  {{ '✓' if item.ok else '✗' }}  {{ item.name }}
          {% endfor %}
          ║                                                                ║
          {% if failed_checks | length > 0 %}
          ║  ── INCOMPLETE ──                                              ║
          {% for item in failed_checks %}
          ║    - {{ item.name }}
          {% endfor %}
          {% else %}
          ║  Section 5 complete — all exercises verified.                  ║
          {% endif %}
          ║                                                                ║
          ╚══════════════════════════════════════════════════════════════════╝
